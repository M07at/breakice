name: build-cloudrun-image

# 在 GitHub 的 Docker 环境里构建镜像，推送到 GitHub Container Registry（ghcr.io）。
# 云托管只负责「从镜像仓库拉取镜像」运行——绕开云托管自带构建器的兼容问题。
#
# 为什么用 ghcr.io：CI 本来就在 GitHub，GITHUB_TOKEN 自动可用，不需要额外申请
# 任何账号或密码；把包设为 Public 后，云托管拉取也不需要认证。
#
# 可选：如果你想改用腾讯云 TCR，见文件末尾的注释。

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "deploy/cloudrun/**"
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/local/**"
      - ".github/workflows/build-cloudrun-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build context
        run: |
          set -euo pipefail
          rm -rf build-ctx
          mkdir -p build-ctx
          cp deploy/cloudrun/Dockerfile deploy/cloudrun/nginx.conf \
             deploy/cloudrun/entrypoint.sh deploy/cloudrun/storage-shim.ts build-ctx/
          cp -r supabase/migrations build-ctx/migrations
          cp -r supabase/functions build-ctx/functions
          mkdir -p build-ctx/local
          cp supabase/local/00-supabase-shim.sql build-ctx/local/
          echo "--- context ---"
          find build-ctx -type f | head -40

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: build-ctx
          file: build-ctx/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/breakice-backend:latest
            ghcr.io/${{ github.repository_owner }}/breakice-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ============ 如果以后要改用腾讯云 TCR ============
