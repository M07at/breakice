name: build-cloudrun-image

# 在 GitHub 的 Docker 环境里构建镜像，推送到腾讯云容器镜像服务（TCR），
# 云托管只负责「从镜像仓库拉取镜像」运行——绕开云托管自带构建器的兼容问题。
#
# 需要的 Secrets（仓库设置 → Secrets and variables → Actions）：
#   TCR_REGISTRY   例：ccr.ccs.tencentyun.com
#   TCR_NAMESPACE  例：breakice（TCR 个人版里创建的命名空间）
#   TCR_USERNAME   TCR 登录用户名（通常是腾讯云账号 ID）
#   TCR_PASSWORD   TCR 登录密码

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "deploy/cloudrun/**"
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/local/**"
      - ".github/workflows/build-cloudrun-image.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build context
        run: |
          set -euo pipefail
          rm -rf build-ctx
          mkdir -p build-ctx
          cp deploy/cloudrun/Dockerfile deploy/cloudrun/nginx.conf \
             deploy/cloudrun/entrypoint.sh deploy/cloudrun/storage-shim.ts build-ctx/
          cp -r supabase/migrations build-ctx/migrations
          cp -r supabase/functions build-ctx/functions
          mkdir -p build-ctx/local
          cp supabase/local/00-supabase-shim.sql build-ctx/local/
          ls -R build-ctx | head -40

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to TCR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: build-ctx
          file: build-ctx/Dockerfile
          push: true
          tags: |
            ${{ secrets.TCR_REGISTRY }}/${{ secrets.TCR_NAMESPACE }}/breakice-backend:latest
            ${{ secrets.TCR_REGISTRY }}/${{ secrets.TCR_NAMESPACE }}/breakice-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
