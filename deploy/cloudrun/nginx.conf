# 云托管容器内的统一入口：按路径分发到各进程
# 云托管「端口」填 80

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # 健康检查
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # REST：房间 / 对局 / 画作元数据
    location /rest/v1/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # 认证：登录 / 匿名登录 / 刷新令牌
    location /auth/v1/ {
        proxy_pass http://127.0.0.1:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # 存储：上传与签名地址（自写的 Deno 服务）
    location /storage/v1/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    # 边缘函数：每个函数一个进程，端口分开
    location /functions/v1/wechat-auth {
        proxy_pass http://127.0.0.1:9101/;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
    location /functions/v1/uc-command {
        proxy_pass http://127.0.0.1:9102/;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
    location /functions/v1/ai-score {
        proxy_pass http://127.0.0.1:9103/;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
    location /functions/v1/draw-score {
        proxy_pass http://127.0.0.1:9104/;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
    location /functions/v1/wechat-qrcode {
        proxy_pass http://127.0.0.1:9105/;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # 临时调试：查看各组件日志（验证完成后删除）
    location /debug/ {
        alias /tmp/;
        autoindex on;
        add_header Content-Type text/plain;
    }

    # 其余路径一律拒绝
    location / {
        return 404;
    }
}
